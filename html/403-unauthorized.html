<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>403 Forbidden - Sistema de Firmas Digitales</title>
    <link rel="stylesheet" href="../css/403-page.css" />
  </head>
  <body>
    <div class="error-container">
      <div class="error-header">
        <div class="error-code">403</div>
        <svg
          class="forbidden-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
        >
          <circle cx="12" cy="12" r="10" />
          <path d="m4.9 4.9 14.2 14.2" />
        </svg>
        <div class="error-title">FORBIDDEN</div>
      </div>

      <p class="error-message">
        No tienes acceso a esta página. Se requiere autenticación para
        continuar.
      </p>

      <a href="/" class="back-button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="m12 19-7-7 7-7" />
          <path d="M19 12H5" />
        </svg>
        Volver al Inicio
      </a>
    </div>

    <!-- Sistema unificado de temas -->
    <script src="../scripts/utils/themeManager.js"></script>
  </body>
</html>
